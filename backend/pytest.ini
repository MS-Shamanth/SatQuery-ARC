[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    # Raised inside rasterio's own transform helpers, not by our code.
    ignore:Use `@` matmul instead:PendingDeprecationWarning
    # Expected: benchmark PNG/JPEG inputs legitimately carry no geotransform.
    ignore::rasterio.errors.NotGeoreferencedWarning
    # Starlette's TestClient bundles httpx; nothing for us to change yet.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated
markers =
    network: test requires outbound network access (deselect with -m "not network")
    slow: test takes more than a few seconds
